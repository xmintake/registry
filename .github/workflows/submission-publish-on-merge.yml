name: Submission publish on merge

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Detect promoted pending paths from merge commit
        id: pending
        run: |
          set -euo pipefail
          merge_sha="${{ github.event.pull_request.merge_commit_sha }}"
          mapfile -t dirs < <(git diff --name-only "${{ github.event.pull_request.base.sha }}" "$merge_sha" \
            | grep '^submissions/pending/' \
            | awk -F/ 'NF>=4 {print $1"/"$2"/"$3"/"$4}' \
            | sort -u)
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "none=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "dirs<<EOF"
            printf '%s\n' "${dirs[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Promote submissions
        if: steps.pending.outputs.none != 'true'
        env:
          XMREGISTRY_PRIVATE_KEY: ${{ secrets.XMREGISTRY_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${XMREGISTRY_PRIVATE_KEY:-}" ]; then
            echo "XMREGISTRY_PRIVATE_KEY secret is not configured." >&2
            exit 1
          fi
          umask 077
          printf '%s' "$XMREGISTRY_PRIVATE_KEY" > /tmp/XMRegistry.private-key.pem
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            echo "Promoting $dir"
            python3 tools/promote-submission.py "$dir" --private-key /tmp/XMRegistry.private-key.pem
          done <<< "${{ steps.pending.outputs.dirs }}"
          rm -f /tmp/XMRegistry.private-key.pem

      - name: Commit promoted artifacts
        if: steps.pending.outputs.none != 'true'
        run: |
          set -euo pipefail
          git config user.name "xmregistry-bot"
          git config user.email "xmregistry-bot@users.noreply.github.com"
          git add destinations schemas catalog submissions/pending
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "registry: promote submission(s) from PR #${{ github.event.pull_request.number }}"
          git push origin main
